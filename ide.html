<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dery Studio — write websites in English</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Ctext x='50' y='70' font-size='54' font-family='sans-serif' font-weight='800' fill='%23FF8A00' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg:#07090F; --panel:#0E131C; --panel2:#131A25; --line:rgba(255,255,255,0.09);
    --text:#EDF2FF; --muted:rgba(237,242,255,0.55); --accent:#FF8A00; --accent2:#FFB340;
    --green:#16A34A; --red:#F05252; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  header {
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0;
  }
  .logo { width:30px; height:30px; border-radius:9px; background:#000; display:grid; place-items:center;
    color:var(--accent); font-weight:900; font-size:17px; border:1px solid rgba(255,138,0,0.35); }
  .brand { font-size:14.5px; font-weight:800; letter-spacing:-0.02em; }
  .brand span { color:var(--accent); }
  .spacer { flex:1; }
  .btn {
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:8px 13px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer;
    white-space:nowrap; transition:transform .12s, background .15s, border-color .15s;
  }
  .btn:active { transform:scale(.96); }
  .btn.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a1200; border:none; }
  main { flex:1; display:flex; min-height:0; }
  .pane { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #left { flex:1 1 46%; border-right:1px solid var(--line); }
  #right { flex:1 1 54%; background:#fff; }
  .pane-head {
    display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:11px; font-weight:800;
    letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
    background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .editor-wrap { flex:1; display:flex; min-height:0; background:#0A0E15; }
  #gutter {
    padding:14px 6px 14px 12px; font-family:var(--mono); font-size:13px; line-height:1.62;
    color:rgba(237,242,255,0.25); text-align:right; user-select:none; overflow:hidden;
    background:#0A0E15; min-width:38px;
  }
  #editor {
    flex:1; border:none; outline:none; resize:none; background:transparent; color:#E8EEFB;
    font-family:var(--mono); font-size:13px; line-height:1.62; padding:14px 12px 14px 4px;
    tab-size:2; white-space:pre; overflow:auto;
  }
  #editor::placeholder { color:rgba(237,242,255,0.25); }
  #errors {
    flex-shrink:0; max-height:34%; overflow:auto; border-top:1px solid var(--line);
    background:#0B0F16; padding:0;
  }
  #errors:empty { display:none; }
  .err { display:flex; gap:9px; padding:9px 12px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:12.5px; }
  .err .n { color:var(--red); font-weight:900; font-family:var(--mono); flex-shrink:0; }
  .err .msg { color:#FFC9C9; font-weight:600; }
  .err .hint { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .ok { display:flex; align-items:center; gap:8px; padding:9px 12px; font-size:12.5px; color:#8CE99A; font-weight:700; }
  #preview { flex:1; width:100%; border:none; background:#fff; }
  .ptab {
    background:none; border:none; color:var(--muted); font:inherit; font-size:11px; font-weight:800;
    letter-spacing:.07em; text-transform:uppercase; padding:4px 2px; cursor:pointer; border-bottom:2px solid transparent;
  }
  .ptab.on { color:var(--text); border-bottom-color:var(--accent); }
  #console {
    flex:1; margin:0; overflow:auto; background:#0A0E15; color:#C7F5D2;
    font-family:var(--mono); font-size:12.5px; line-height:1.7; padding:14px;
    white-space:pre-wrap; word-break:break-word;
  }
  #console .ph { color:rgba(237,242,255,0.35); }
  .exbar { display:flex; gap:6px; padding:6px 10px; background:var(--panel2); border-bottom:1px solid var(--line); overflow-x:auto; }
  .exbar button { flex-shrink:0; font-size:11.5px; padding:6px 11px; }
  .status {
    padding:6px 12px; font-size:11.5px; color:var(--muted); background:var(--panel);
    border-top:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-shrink:0;
  }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; margin-right:6px; }
  .dot.bad { background:var(--red); }
  /* mobile: stack panes with a tab switch */
  .tabs { display:none; }
  @media (max-width:820px) {
    main { flex-direction:column; }
    #left, #right { flex:1 1 auto; border-right:none; }
    #right { border-top:1px solid var(--line); }
    .tabs { display:flex; gap:6px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
    .tabs button { flex:1; }
    .pane.hide-mobile { display:none; }
    #errors { max-height:28%; }
  }
  /* help drawer */
  #help {
    position:fixed; inset:0; background:rgba(3,5,9,0.72); backdrop-filter:blur(4px);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  #help.open { display:flex; }
  #help .sheet {
    background:var(--panel); width:100%; max-width:640px; max-height:82dvh; overflow:auto;
    border-radius:18px 18px 0 0; border-top:1px solid rgba(255,138,0,0.35); padding:18px 18px 26px;
  }
  #help h3 { margin:0 0 4px; font-size:16px; }
  #help p.lead { margin:0 0 14px; font-size:12.5px; color:var(--muted); }
  #help .row { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
  #help code {
    font-family:var(--mono); font-size:11.5px; color:var(--accent2); flex:1 1 60%;
    word-break:break-word;
  }
  #help .mean { flex:1 1 40%; font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="logo">T</div>
  <div class="brand">Dery <span>Studio</span></div>
  <div class="spacer"></div>
  <button class="btn" id="helpBtn">How to write</button>
  <button class="btn" id="dlBtn">Save HTML</button>
  <button class="btn primary" id="runBtn">▶ Run</button>
</header>

<div class="tabs">
  <button class="btn" id="tabCode">English</button>
  <button class="btn" id="tabWeb">Website</button>
</div>

<main>
  <div class="pane" id="left">
    <div class="pane-head">Write in plain English</div>
    <div class="editor-wrap">
      <div id="gutter">1</div>
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </div>
    <div id="errors"></div>
  </div>
  <div class="pane" id="right">
    <div class="pane-head" style="gap:14px">
      <button class="ptab on" id="ptabWeb">Website</button>
      <button class="ptab" id="ptabOut">Output <span id="outCount"></span></button>
      <span class="spacer"></span>
      <span id="size" style="text-transform:none;letter-spacing:0"></span>
    </div>
    <iframe id="preview" title="Website preview"></iframe>
    <pre id="console" style="display:none"></pre>
  </div>
</main>

<div class="status" id="status">
  <span><span class="dot" id="dot"></span><span id="stateText">Ready</span></span>
  <span id="counts"></span>
</div>

<div id="help">
  <div class="sheet">
    <h3>Write like you talk</h3>
    <p class="lead">Every line is a normal English sentence. End with a full stop. Quotes hold your own words.</p>
    <div id="helpRows"></div>
  </div>
</div>

<script src="dery2.js"></script>
<script>
(function () {
  const EXAMPLES = {
    "Business site": `# Write plain English. One sentence per line.
Create a website called "Kyenjojo Phones".

Add a navigation bar with "Home", "Phones", "Contact".
Add a big heading that says "Phone repairs in Kyenjojo".
Add a paragraph that says "We fix phones the same day. Bring yours.".

Remember that screen is 25000.
Add a heading that says "Our prices".
Add a paragraph that says "Screen replacement costs " plus screen plus " shillings.".

Repeat 3 times:
  Add a paragraph that says "Technician " plus it plus " is on duty today.".
End the repeat.

Add a button that says "Call us" linking to "tel:+256700000000".
Add a footer that says "Kyenjojo, Uganda".
Make the background color dark.
Set the text color to white.
Make the buttons orange.
Center everything.`,

    "Calculator": `# Dery does maths, like any language.
Remember that price is 5000.
Remember that quantity is 3.
Remember that total is price times quantity.
Show "Total: " plus total.

Add 500 to total.
Show "After delivery: " plus total.

If total is more than 15000 then show "That is a big order.".

Remember that counter is 0.
While counter is less than 3:
  Add 1 to counter.
  Show "Count " plus counter.
End the while.`,

    "Loans": `# A real DeryCode calculation: a SACCO loan.
Remember that principal is 500000.
Remember that rate is 15.
Remember that months is 6.

Remember that interest is principal times rate divided by 100.
Remember that total is principal plus interest.
Remember that monthly is total divided by months.

Show "Principal: " plus principal.
Show "Interest: " plus interest.
Show "Total to repay: " plus total.
Show "Each month: " plus monthly.

If interest is more than 50000 then show "Flag: interest is high.".

Make a function called receipt that takes amount:
  Show "Receipt written for " plus amount.
End the function.
Call receipt with total.`,

    "Landing page": `Create a website called "Peters Medicare".
Add a navigation bar with "Home", "Services", "Doctors", "Contact".
Add a big heading that says "Healthcare you can trust in Kyenjojo".
Add a paragraph that says "Walk in any day. Our doctors are here from 8 in the morning.".
Add a button that says "Call us now" linking to "tel:+256700000000".
Add a list with "General treatment", "Maternity care", "Laboratory tests", "Pharmacy".
Add a section called "Book an appointment".
Add a contact form.
End the section.
Add a footer that says "Peters Medicare, Kyenjojo, Uganda".
Make the background color dark.
Set the text color to white.
Make the buttons orange.
Center everything.`,
  };

  const STARTER = EXAMPLES["Business site"];

  const HELP = [
    ["Create a website called \"Name\"", "page title"],
    ["Add a navigation bar with \"Home\", \"About\"", "menu links"],
    ["Add a big heading that says \"Text\"", "page heading"],
    ["Add a paragraph that says \"Text\"", "body text (can use variables)"],
    ["Add a button that says \"Call us\" linking to \"tel:...\"", "button"],
    ["Add a list with \"One\", \"Two\"", "bullet list (\"numbered list\" for 1,2,3)"],
    ["Add an image showing \"https://...\"", "picture"],
    ["Add a section called \"Title\" ... End the section", "group of content"],
    ["Add a contact form", "name, phone, message"],
    ["Add a footer that says \"Text\"", "bottom line"],
    ["Make the background color dark", "also light, navy, blue, \"#123456\""],
    ["Set the text color to white", "text colour"],
    ["Make the buttons orange", "accent colour"],
    ["Center everything", "centre the page"],
    ["Remember that price is 5000", "a variable"],
    ["Set price to price plus 500", "change a variable"],
    ["Add 500 to price", "quick maths"],
    ["Multiply price by 2", "quick maths"],
    ["Show \"Total: \" plus price", "print (see Output tab)"],
    ["If price is more than 10 then show \"big\"", "one-line decision"],
    ["If ... : Otherwise: ... End the if", "block decision"],
    ["Repeat 3 times: ... End the repeat", "loop, counter is called it"],
    ["While counter is less than 5: ... End the while", "loop until false"],
    ["Make a function called greet that takes name: ... End the function", "function"],
    ["Call greet with \"Tooro\"", "run a function"],
  ];
  const editor = document.getElementById("editor");
  const gutter = document.getElementById("gutter");
  const preview = document.getElementById("preview");
  const consoleEl = document.getElementById("console");
  const errorsBox = document.getElementById("errors");
  const stateText = document.getElementById("stateText");
  const dot = document.getElementById("dot");
  const counts = document.getElementById("counts");
  const size = document.getElementById("size");
  const outCount = document.getElementById("outCount");

  /* examples bar */
  const bar = document.createElement("div");
  bar.className = "exbar";
  Object.keys(EXAMPLES).forEach((name) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = name;
    b.onclick = () => {
      if (editor.value.trim() && !confirm("Replace your code with the " + name + " example?")) return;
      editor.value = EXAMPLES[name];
      syncGutter();
      run();
    };
    bar.appendChild(b);
  });
  document.getElementById("left").insertBefore(bar, document.getElementById("left").children[1]);

  document.getElementById("helpRows").innerHTML = HELP.map(
    (h) => `<div class="row"><code>${h[0].replace(/</g, "&lt;")}</code><div class="mean">${h[1]}</div></div>`
  ).join("");

  document.getElementById("helpBtn").onclick = () => document.getElementById("help").classList.add("open");
  document.getElementById("help").onclick = (e) => {
    if (e.target.id === "help") document.getElementById("help").classList.remove("open");
  };

  /* right pane tabs */
  let pane = "web";
  function showPane(which) {
    pane = which;
    document.getElementById("ptabWeb").classList.toggle("on", which === "web");
    document.getElementById("ptabOut").classList.toggle("on", which === "out");
    preview.style.display = which === "web" ? "block" : "none";
    consoleEl.style.display = which === "out" ? "block" : "none";
  }
  document.getElementById("ptabWeb").onclick = () => showPane("web");
  document.getElementById("ptabOut").onclick = () => showPane("out");

  /* restore last session */
  const saved = localStorage.getItem("dery2.studio.source");
  editor.value = saved || STARTER;

  function syncGutter() {
    const n = editor.value.split("\n").length;
    let out = "";
    for (let i = 1; i <= Math.max(n, 12); i++) out += i + "\n";
    gutter.textContent = out;
    gutter.scrollTop = editor.scrollTop;
  }

  let lastResult = null;

  function run() {
    const src = editor.value;
    localStorage.setItem("dery2.studio.source", src);

    const result = window.Dery.run(src);
    lastResult = result;

    preview.srcdoc = result.html;

    /* output console */
    if (result.output.length) {
      consoleEl.innerHTML = result.output
        .map((l) => `<div>${String(l).replace(/</g, "&lt;")}</div>`)
        .join("");
      outCount.textContent = "(" + result.output.length + ")";
    } else {
      consoleEl.innerHTML = `<div class="ph">Nothing printed yet. Use: Show "Hello".</div>`;
      outCount.textContent = "";
    }

    const sentences = result.stats.sentences;
    counts.textContent = `${sentences} statements · ${result.output.length} lines out · ${Math.round(result.html.length / 1024 * 10) / 10} KB`;
    size.textContent = "· live";

    if (result.errors.length === 0) {
      errorsBox.innerHTML = `<div class="ok">✓ Every sentence understood. Ran ${sentences} statements to the end.</div>`;
      stateText.textContent = "Ran clean";
      dot.className = "dot";
    } else {
      errorsBox.innerHTML = result.errors
        .map(
          (e) =>
            `<div class="err"><span class="n">${e.line || "!"}</span><div><div class="msg">${String(e.message).replace(/</g, "&lt;")}</div>${e.hint ? `<div class="hint">${e.hint.replace(/</g, "&lt;")}</div>` : ""}</div></div>`
        )
        .join("");
      stateText.textContent = `${result.errors.length} problem${result.errors.length === 1 ? "" : "s"}`;
      dot.className = "dot bad";
    }
  }

  editor.addEventListener("input", syncGutter);
  editor.addEventListener("scroll", () => (gutter.scrollTop = editor.scrollTop));
  editor.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = editor.selectionStart;
      editor.value = editor.value.slice(0, s) + "  " + editor.value.slice(editor.selectionEnd);
      editor.selectionStart = editor.selectionEnd = s + 2;
      syncGutter();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      run();
    }
  });

  document.getElementById("runBtn").onclick = run;

  document.getElementById("dlBtn").onclick = () => {
    const result = lastResult || window.Dery.run(editor.value);
    const blob = new Blob([result.html], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const name = (result.page.title || "website").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    a.download = name + ".html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  /* mobile tab switching */
  const left = document.getElementById("left");
  const right = document.getElementById("right");
  document.getElementById("tabCode").onclick = () => {
    left.classList.remove("hide-mobile");
    right.classList.add("hide-mobile");
  };
  document.getElementById("tabWeb").onclick = () => {
    right.classList.remove("hide-mobile");
    left.classList.add("hide-mobile");
  };
  if (window.matchMedia("(max-width:820px)").matches) right.classList.add("hide-mobile");

  syncGutter();
  run();
})();
</script>
</body>
</html>
